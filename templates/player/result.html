<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลสรุป - {{ settings.game_name or 'Quiz' }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/player.css">
  <script src="/static/js/sounds.js"></script>
</head>
<body>
  <div class="page-wrap">
    <div class="container">
      <div class="result-card" id="resultCard">
        <header class="result-header" id="statusHeader">
          <div class="result-icon" id="statusIcon">🏆</div>
          <h1 id="statusTitle">กำลังโหลด...</h1>
          <p id="statusMsg"></p>
        </header>

        <div class="result-body">
          <div class="correct-summary" id="correctSummary">
            <p class="stat-label">ตอบถูก</p>
            <p class="stat-value"><span id="correct">0</span> <span class="correct-of">/ <span id="totalQ">0</span> ข้อ</span></p>
          </div>

          <div class="detail-box">
            <div class="detail-row">
              <span class="label">หมวดหมู่</span>
              <span class="value" id="catName">—</span>
            </div>
            <div class="detail-row">
              <span class="label">ผู้เล่น</span>
              <span class="value" id="playerName">—</span>
            </div>
          </div>

          <div class="promo-box hidden" id="promoBox">
            <p class="promo-title" id="promoTitle"></p>
            <p class="promo-text" id="promoText"></p>
          </div>
          <div class="qr-block hidden" id="qrBlock">
            <img id="qrImg" alt="QR ประชาสัมพันธ์">
            <p class="qr-label" id="qrLabel"></p>
            <p class="qr-url" id="qrUrl"></p>
          </div>

          <a href="/player" class="btn btn-primary">เล่นอีกครั้ง</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sessionId = new URLSearchParams(window.location.search).get('session_id') || '{{ session_id }}';

    async function loadResult() {
      try {
        const res = await fetch('/api/player/result/' + sessionId);
        const data = await res.json();
        if (!res.ok) {
          alert(data.message || 'ไม่พบผลการเล่น');
          window.location.href = '/player';
          return;
        }

        const totalQ = data.total_questions
          || ((data.correct_count || 0) + (data.wrong_count || 0) + (data.timeout_count || 0))
          || 0;
        document.getElementById('correct').textContent = data.correct_count || 0;
        document.getElementById('totalQ').textContent = totalQ;
        document.getElementById('catName').textContent = data.category_name || '—';
        document.getElementById('playerName').textContent = data.player_name || '—';

        const header = document.getElementById('statusHeader');
        const icon = document.getElementById('statusIcon');
        const title = document.getElementById('statusTitle');
        const msg = document.getElementById('statusMsg');

        if (data.is_passed) {
          header.classList.add('pass');
          icon.textContent = '🏆';
          title.textContent = 'ผ่านเกณฑ์!';
          msg.textContent = data.reward_message || data.pass_message || 'ยินดีด้วย!';
        } else {
          header.classList.add('fail');
          icon.textContent = '💪';
          title.textContent = 'ยังไม่ผ่านเกณฑ์';
          msg.textContent = data.reward_message || data.fail_message || 'ลองใหม่อีกครั้งนะ';
        }

        if (data.promo_title || data.promo_message) {
          document.getElementById('promoTitle').textContent = data.promo_title || '';
          document.getElementById('promoText').textContent = data.promo_message || '';
          document.getElementById('promoBox').classList.remove('hidden');
        }
        if (data.show_qr_result && data.qr_url) {
          document.getElementById('qrImg').src = '/api/qr.svg?u=' + encodeURIComponent(data.qr_url);
          document.getElementById('qrLabel').textContent = data.qr_label || '';
          document.getElementById('qrUrl').textContent = data.qr_url;
          document.getElementById('qrBlock').classList.remove('hidden');
        }

        document.getElementById('resultCard').classList.add('visible');
        try {
          const shouldPlay = sessionStorage.getItem('play_finish_sound') === '1';
          sessionStorage.removeItem('play_finish_sound');
          const soundOn = (typeof data.enable_sound !== 'undefined')
            ? !!data.enable_sound
            : (function() {
                try {
                  const raw = sessionStorage.getItem('quiz_session');
                  return raw ? !!JSON.parse(raw).enable_sound : true;
                } catch (e2) { return true; }
              })();
          if (shouldPlay && soundOn && window.QuizSound) {
            QuizSound.setEnabled(true);
            QuizSound.preload();
            setTimeout(function() { QuizSound.play('finish'); }, 250);
          }
        } catch (e) {}
      } catch (err) {
        alert('ไม่สามารถโหลดผลลัพธ์ได้');
        window.location.href = '/player';
      }
    }

    loadResult();
  </script>
</body>
</html>
