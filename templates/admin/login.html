<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - วิทยาลัยเทคนิคเพชรบุรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', 'Sarabun', sans-serif;
      background: linear-gradient(165deg, #005a87 0%, #007cba 50%, #0693e3 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-2xl overflow-hidden border border-sky-100">
      <div class="px-8 py-7 text-center text-white" style="background: linear-gradient(135deg, #005a87 0%, #007cba 60%, #0284c7 100%);">
        <img src="/static/images/pbtc-logo.png" alt="โลโก้ วท.เพชรบุรี"
             class="mx-auto h-20 w-20 object-contain bg-white rounded-full p-1.5 shadow mb-3"
             onerror="this.style.display='none'">
        <h1 class="text-xl font-bold">Admin Dashboard</h1>
        <p class="text-sky-100 text-sm mt-1">วิทยาลัยเทคนิคเพชรบุรี</p>
      </div>
      <form method="POST" class="px-8 py-8 space-y-5">
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error }}</div>
        {% endif %}
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้</label>
          <input type="text" name="username" required autofocus
                 class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-sky-600 focus:ring-2 focus:ring-sky-100 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
          <input type="password" name="password" required
                 class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-sky-600 focus:ring-2 focus:ring-sky-100 outline-none">
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-sky-700 hover:bg-sky-800 text-white font-semibold transition">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
    <p class="text-center text-sky-100/80 text-xs mt-6">Default: admin / admin123</p>
  </div>
</body>
</html>
