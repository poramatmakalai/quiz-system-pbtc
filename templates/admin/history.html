{% extends "admin/base.html" %}
{% block title %}ประวัติ{% endblock %}
{% block page_title %}ประวัติผลการเล่น{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center gap-3 mb-6">
  <select id="filterCat" class="px-3 py-2 rounded-lg border border-gray-200 text-sm">
    <option value="">ทุกหมวดหมู่</option>
  </select>
  <input type="date" id="dateFrom" class="px-3 py-2 rounded-lg border border-gray-200 text-sm">
  <input type="date" id="dateTo" class="px-3 py-2 rounded-lg border border-gray-200 text-sm">
  <input type="text" id="searchH" placeholder="ค้นหาชื่อผู้เล่น..." class="px-3 py-2 rounded-lg border border-gray-200 text-sm w-40">
  <button onclick="loadHistory(1)" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm">ค้นหา</button>
  <div class="flex-1"></div>
  <a href="/api/admin/history/export" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-medium">Export CSV</a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
      <tr>
        <th class="px-4 py-3 text-left">ผู้เล่น</th>
        <th class="px-4 py-3 text-left">หมวดหมู่</th>
        <th class="px-4 py-3 text-center">คะแนน</th>
        <th class="px-4 py-3 text-center">%</th>
        <th class="px-4 py-3 text-center">ถูก/ผิด/หมด</th>
        <th class="px-4 py-3 text-center">สถานะ</th>
        <th class="px-4 py-3 text-right">เวลา</th>
        <th class="px-4 py-3 text-right"></th>
      </tr>
    </thead>
    <tbody id="histTable" class="divide-y divide-gray-100">
      <tr><td colspan="8" class="px-6 py-8 text-center text-gray-400">กำลังโหลด...</td></tr>
    </tbody>
  </table>
</div>
<div id="pagination" class="mt-4 flex items-center justify-center gap-2 text-sm"></div>
{% endblock %}
{% block scripts %}
<script>
  let currentPage = 1;

  async function init() {
    const cats = await api('/api/admin/categories');
    const sel = document.getElementById('filterCat');
    cats.forEach(c => {
      sel.innerHTML += `<option value="${c.id}">${escapeHtml(c.name)}</option>`;
    });
    loadHistory(1);
  }

  async function loadHistory(page = 1) {
    currentPage = page;
    let url = `/api/admin/history?page=${page}&per_page=20`;
    const cat = document.getElementById('filterCat').value;
    const df = document.getElementById('dateFrom').value;
    const dt = document.getElementById('dateTo').value;
    const search = document.getElementById('searchH').value.trim();
    if (cat) url += `&category_id=${cat}`;
    if (df) url += `&date_from=${df}`;
    if (dt) url += `&date_to=${dt}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;

    try {
      const data = await api(url);
      const tbody = document.getElementById('histTable');
      if (!data.items.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-400">ไม่พบข้อมูล</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      tbody.innerHTML = data.items.map(r => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium">${escapeHtml(r.player_name || '-')}</td>
          <td class="px-4 py-3 text-gray-500 text-xs">${escapeHtml(r.category_name)}</td>
          <td class="px-4 py-3 text-center">${r.earned_points}/${r.total_points}</td>
          <td class="px-4 py-3 text-center font-medium">${r.percentage}%</td>
          <td class="px-4 py-3 text-center text-xs">
            <span class="text-green-600">${r.correct_count}</span> /
            <span class="text-red-500">${r.wrong_count}</span> /
            <span class="text-amber-600">${r.timeout_count}</span>
          </td>
          <td class="px-4 py-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${r.is_passed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
              ${r.is_passed ? 'ผ่าน' : 'ไม่ผ่าน'}
            </span>
          </td>
          <td class="px-4 py-3 text-right text-xs text-gray-400">${r.played_at || ''}</td>
          <td class="px-4 py-3 text-right">
            <button onclick="deleteHist(${r.id})" class="text-red-400 hover:text-red-600 text-xs">ลบ</button>
          </td>
        </tr>
      `).join('');

      // Pagination
      const pag = document.getElementById('pagination');
      if (data.pages <= 1) {
        pag.innerHTML = '';
      } else {
        let html = '';
        for (let i = 1; i <= data.pages; i++) {
          html += `<button onclick="loadHistory(${i})" class="px-3 py-1 rounded ${i === data.page ? 'bg-indigo-600 text-white' : 'bg-gray-100 hover:bg-gray-200'}">${i}</button>`;
        }
        pag.innerHTML = html;
      }
    } catch (e) {
      showToast('โหลดไม่สำเร็จ', 'error');
    }
  }

  async function deleteHist(id) {
    if (!confirm('ยืนยันลบประวัตินี้?')) return;
    try {
      await api(`/api/admin/history/${id}`, { method: 'DELETE' });
      showToast('ลบสำเร็จ');
      loadHistory(currentPage);
    } catch (e) {
      showToast('ลบไม่สำเร็จ', 'error');
    }
  }

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
  }
  init();
</script>
{% endblock %}
