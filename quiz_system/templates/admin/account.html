{% extends "admin/base.html" %}
{% block title %}บัญชี{% endblock %}
{% block page_title %}บัญชีผู้ดูแล{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
    <h2 class="font-semibold text-gray-800 mb-4">ข้อมูลบัญชี</h2>
    <div class="space-y-2 text-sm">
      <div class="flex justify-between">
        <span class="text-gray-500">ชื่อผู้ใช้</span>
        <span class="font-medium">{{ admin.username }}</span>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h2 class="font-semibold text-gray-800 mb-4">เปลี่ยนรหัสผ่าน</h2>
    <form id="pwForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านปัจจุบัน</label>
        <input type="password" id="currentPw" required class="w-full px-3 py-2 rounded-lg border border-gray-200 outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
        <input type="password" id="newPw" required minlength="6" class="w-full px-3 py-2 rounded-lg border border-gray-200 outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmPw" required minlength="6" class="w-full px-3 py-2 rounded-lg border border-gray-200 outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium">
        เปลี่ยนรหัสผ่าน
      </button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('newPw').value;
    const confirmPw = document.getElementById('confirmPw').value;
    if (newPw !== confirmPw) {
      showToast('รหัสผ่านใหม่ไม่ตรงกัน', 'error');
      return;
    }
    try {
      await api('/api/admin/change-password', {
        method: 'POST',
        body: JSON.stringify({
          current_password: document.getElementById('currentPw').value,
          new_password: newPw
        })
      });
      showToast('เปลี่ยนรหัสผ่านสำเร็จ');
      document.getElementById('pwForm').reset();
    } catch (err) {
      showToast(err.data?.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ', 'error');
    }
  });
</script>
{% endblock %}
